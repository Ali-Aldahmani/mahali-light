name: Build Check

on:
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-build:
    name: Build Check
    runs-on: ubuntu-latest

    # Backs the live-database suites (tests/integration/invoiceIntegrity.test.js,
    # tests/contracts/concurrency.live.test.js) — without this they silently
    # skip (see MED-06 in CODEBASE_AUDIT.md), so `npm test` passing here
    # never actually proved money/inventory correctness.
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          npm install
          npm --prefix web install

      - name: Run tests
        run: npm test
        env:
          INVOICE_TEST_PG_PORT: 5432
          INVOICE_TEST_PG_USER: postgres
          INVOICE_TEST_PG_PASSWORD: postgres
          RUN_PG_CONCURRENCY: 1

      - name: Build frontend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Build success
        run: |
          echo "Build check passed"
          echo "Ready to merge to main"

  fastapi-tests:
    name: FastAPI (ML sidecar) tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-fastapi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v
