name: Build Check

on:
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-build:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          npm install
          npm --prefix web install

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Build success
        run: |
          echo "Build check passed"
          echo "Ready to merge to main"
