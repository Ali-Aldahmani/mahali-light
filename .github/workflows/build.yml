name: Build Check

on:
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-build:
    name: Lint & Build Check
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Lint frontend
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Validate Electron builder config
        run: npm run build:electron:dir
        env:
          NODE_ENV: production
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build success
        run: |
          echo "Build check passed"
          echo "Ready to merge to main"
