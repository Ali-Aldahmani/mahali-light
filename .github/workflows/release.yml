name: Build & Release

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: fastapi-tests
    permissions:
      contents: write

    # Backs the live-database suites — without this they silently skip (see
    # MED-06 in CODEBASE_AUDIT.md), so a release could ship without ever
    # actually proving money/inventory correctness.
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          npm install
          npm --prefix web install

      - name: Run tests
        run: npm test
        env:
          INVOICE_TEST_PG_PORT: 5432
          INVOICE_TEST_PG_USER: postgres
          INVOICE_TEST_PG_PASSWORD: postgres
          RUN_PG_CONCURRENCY: 1

      - name: Build frontend
        run: npm run build
        env:
          NODE_ENV: production

      # Docker-first deployment (see README.md) — there is no separate
      # installer to build or attach. This just tags a validated commit as a
      # release; Settings → About → Check for updates pulls this tag's
      # source archive directly.
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Mahali Light POS ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Mahali Light POS ${{ github.ref_name }}

            Docker-first deployment — see [README.md](../../blob/main/README.md) for setup.

            No separate installer: existing deployments can update in place
            from **Settings → About → Check for updates** (Admin only), or
            pull this tag and run `docker compose up -d --build`.

            ---
            **Publisher:** Ali Aldahmani · **Bytecra**
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  fastapi-tests:
    name: FastAPI (ML sidecar) tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-fastapi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v
