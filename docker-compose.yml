# Bytecra POS — Docker (Next.js web + Express API + PostgreSQL 16).
# FastAPI/ML is optional: docker compose --profile ml up -d
# PostgreSQL is not published to the LAN.

name: bytecrapos

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mahali_light}
      POSTGRES_USER: ${POSTGRES_USER:-mahali}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      # Server logs + psql sessions. The API sets its own session timezone
      # (server/db/postgres.js), so existing volumes don't need re-initdb.
      TZ: ${STORE_TIMEZONE:-Asia/Dubai}
      PGTZ: ${STORE_TIMEZONE:-Asia/Dubai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./docker/postgres/backups:/backups
    networks:
      - bytecrapos
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  express-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: bytecrapos-api:1.1.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: '3000'
      STORE_TIMEZONE: ${STORE_TIMEZONE:-Asia/Dubai}
      TZ: ${STORE_TIMEZONE:-Asia/Dubai}
      # Only the HTTPS front door (Caddy) may forward client IPs and the
      # original scheme (X-Forwarded-For / X-Forwarded-Proto).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-web-tls}
      PGHOST: postgres
      PGPORT: '5432'
      PGUSER: ${POSTGRES_USER:-mahali}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-mahali_light}
      PGPOOL_CONN_MS: '10000'
      UPLOADS_DIR: /data/uploads
      MAHALI_UPLOADS_DIR: /data/uploads
      TLS_DIR: /data/tls
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      MAHALI_PG_BIN_DIR: /usr/lib/postgresql/16/bin
      SERVER_USE_HTTPS: ${SERVER_USE_HTTPS:-false}
      SERVER_IP: ${SERVER_IP:-127.0.0.1}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    # Reachable from this PC only, for scripts and troubleshooting. Tills
    # reach the API through Caddy on HTTPS (authentication audit AUTH-01);
    # the API refuses plain-HTTP requests that come from anywhere else.
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    volumes:
      - api_uploads:/data/uploads
      - api_backups:/app/backups
      - api_tls:/data/tls
    networks:
      - bytecrapos
    shm_size: '256mb'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- --no-check-certificate https://127.0.0.1:3000/api/health || wget -qO- http://127.0.0.1:3000/api/health || exit 1',
        ]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 50s

  nextjs:
    build:
      context: .
      dockerfile: web/Dockerfile
      # No NEXT_PUBLIC_EXPRESS_PORT here: in Docker the browser reaches live
      # updates on the page's own HTTPS address, through Caddy.
    image: bytecrapos-web:1.1.0
    restart: unless-stopped
    depends_on:
      express-api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      EXPRESS_INTERNAL_URL: http://express-api:3000
    # Not published: tills open the POS through Caddy (web-tls).
    networks:
      - bytecrapos
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:3000\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 40s

  # The shop's front door: https://SERVER_IP for every till and phone
  # (authentication audit AUTH-01). Port 80 only redirects to HTTPS. Each
  # device trusts the shop certificate once: docs/HTTPS_SETUP.md.
  web-tls:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      nextjs:
        condition: service_healthy
      express-api:
        condition: service_healthy
    environment:
      SERVER_IP: ${SERVER_IP:-127.0.0.1}
    ports:
      - '${WEB_PORT:-80}:80'
      - '${WEB_TLS_PORT:-443}:443'
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker/caddy-entrypoint.sh:/entrypoint.sh:ro
      - web_tls:/certs
    entrypoint: ['/bin/sh', '/entrypoint.sh']
    networks:
      - bytecrapos

  fastapi:
    profiles: ['ml']
    build:
      context: ./backend-fastapi
      dockerfile: Dockerfile
    image: bytecrapos-ml:0.1.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PGHOST: postgres
      PGPORT: '5432'
      PGUSER: ${POSTGRES_USER:-mahali}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-mahali_light}
    ports:
      - '${FASTAPI_PORT:-8000}:8000'
    networks:
      - bytecrapos

volumes:
  postgres_data:
  api_uploads:
  api_backups:
  api_tls:
  web_tls:

networks:
  bytecrapos:
    driver: bridge
