<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{{title}}</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        font-family: Inter, system-ui, "Segoe UI", sans-serif;
        color: #111827;
        background: #fff;
        font-size: 11px;
      }
      .header {
        background: #F97316;
        color: #fff;
        padding: 14px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .header .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .header .brand img {
        height: 32px;
        width: auto;
      }
      .header h1 {
        font-size: 14px;
        font-weight: 600;
        margin: 0;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .header .meta {
        font-size: 10px;
        opacity: 0.9;
        text-align: right;
      }
      .body { padding: 16px 24px; }
      .summary {
        display: grid;
        grid-template-columns: repeat({{summaryCols}}, 1fr);
        gap: 8px;
        margin-bottom: 14px;
      }
      .summary .card {
        border: 1px solid #E5E7EB;
        border-radius: 8px;
        padding: 8px 10px;
      }
      .summary .label {
        font-size: 9px;
        color: #6B7280;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .summary .value {
        font-size: 13px;
        font-weight: 600;
        color: #111827;
        margin-top: 4px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 10.5px;
      }
      thead th {
        background: #F5F6FA;
        color: #6B7280;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        font-size: 9px;
        font-weight: 600;
        text-align: left;
        padding: 6px 8px;
        border-bottom: 1px solid #E5E7EB;
      }
      thead th.right { text-align: right; }
      tbody td {
        padding: 6px 8px;
        border-bottom: 1px solid #F0F1F5;
      }
      tbody tr:nth-child(even) td { background: #FAFBFC; }
      tbody td.right { text-align: right; font-variant-numeric: tabular-nums; }
      tfoot td {
        background: #F97316;
        color: #fff;
        font-weight: 600;
        padding: 6px 8px;
        font-size: 10.5px;
      }
      tfoot td.right { text-align: right; }
      .footer {
        margin-top: 12px;
        font-size: 9px;
        color: #6B7280;
        text-align: right;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="brand">
        {{logoTag}}
        <div>
          <div style="font-size:9px;opacity:.9;text-transform:uppercase;letter-spacing:.05em;">{{storeName}}</div>
          <h1>{{title}}</h1>
        </div>
      </div>
      <div class="meta">
        <div>{{periodLabel}}</div>
        <div>Generated by {{generatedBy}}</div>
        <div>{{generatedAt}}</div>
      </div>
    </div>
    <div class="body">
      {{summaryHtml}}
      {{tableHtml}}
      <div class="footer">{{footerNote}}</div>
    </div>
  </body>
</html>
